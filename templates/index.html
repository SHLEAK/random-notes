<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave a Note</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Leave a Note</h1>

    <form method="POST">
        <textarea
            name="note"
            placeholder="Write something..."
            required
        ></textarea>

        <br>

        <button type="submit">Leave Note</button>
    </form>

</body>
</html>
